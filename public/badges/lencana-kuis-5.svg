<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="medalPink" x1="30" y1="24" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f9a8d4"/>
      <stop offset="0.55" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="ribbonPinkL" x1="38" y1="66" x2="52" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9d174d"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="ribbonPinkR" x1="68" y1="112" x2="82" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#db2777"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>
    <radialGradient id="shinePink" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ribbons -->
  <path d="M44 62 L36 108 L54 98 L60 106 L60 74 Z" fill="url(#ribbonPinkL)"/>
  <path d="M76 62 L84 108 L66 98 L60 106 L60 74 Z" fill="url(#ribbonPinkR)"/>

  <!-- medal body -->
  <circle cx="60" cy="48" r="34" fill="url(#medalPink)"/>
  <circle cx="60" cy="48" r="27" fill="none" stroke="#fdf2f8" stroke-width="2.5" opacity="0.8"/>

  <!-- flame emblem (streak of 5) -->
  <circle cx="60" cy="48" r="16" fill="#fdf2f8" opacity="0.95"/>
  <path d="M60 35 q6 6.5 4.5 12 a6.5 6.5 0 0 1 -9 0 Q54 41.5 60 35 Z"
        fill="#f43f5e" stroke="#be123c" stroke-width="1.2"/>
  <path d="M60 44 q3 3.4 2 6 a3.4 3.4 0 0 1 -4 0 q-1 -2.6 2 -6 Z" fill="#fda4af"/>

  <!-- gloss -->
  <circle cx="60" cy="48" r="34" fill="url(#shinePink)"/>

  <!-- sparkles -->
  <path d="M92 22 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8 Z" fill="#fbcfe8" opacity="0.95"/>
  <path d="M26 78 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z" fill="#fce7f3" opacity="0.9"/>
</svg>
