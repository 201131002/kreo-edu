<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="medalBlue" x1="30" y1="24" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="0.55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="ribbonBlueL" x1="38" y1="66" x2="52" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ribbonBlueR" x1="68" y1="112" x2="82" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
    <radialGradient id="shineBlue" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ribbons -->
  <path d="M44 62 L36 108 L54 98 L60 106 L60 74 Z" fill="url(#ribbonBlueL)"/>
  <path d="M76 62 L84 108 L66 98 L60 106 L60 74 Z" fill="url(#ribbonBlueR)"/>

  <!-- medal body -->
  <circle cx="60" cy="48" r="34" fill="url(#medalBlue)"/>
  <circle cx="60" cy="48" r="27" fill="none" stroke="#e0f2fe" stroke-width="2.5" opacity="0.8"/>

  <!-- star emblem -->
  <path d="M60 28 L64.7 39.6 L77.2 40.5 L67.7 48.6 L70.6 60.8 L60 54.2 L49.4 60.8 L52.3 48.6 L42.8 40.5 L55.3 39.6 Z"
        fill="#fef9c3" stroke="#facc15" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- gloss -->
  <circle cx="60" cy="48" r="34" fill="url(#shineBlue)"/>

  <!-- sparkles -->
  <path d="M92 22 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8 Z" fill="#fef08a" opacity="0.95"/>
  <path d="M26 78 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z" fill="#bae6fd" opacity="0.9"/>
</svg>
