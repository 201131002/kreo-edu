  <!-- leaves on diagonals -->
  <path d="M40 26 q12 -2 18 8 q-12 2 -18 -8 Z" fill="#4ade80"/>
  <path d="M160 174 q-12 2 -18 -8 q12 -2 18 8 Z" fill="#4ade80"/>
