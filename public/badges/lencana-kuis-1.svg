<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="medalOrange" x1="30" y1="24" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fdba74"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="ribbonOrangeL" x1="38" y1="66" x2="52" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9a3412"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ribbonOrangeR" x1="68" y1="112" x2="82" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ea580c"/>
      <stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <radialGradient id="shineOrange" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ribbons -->
  <path d="M44 62 L36 108 L54 98 L60 106 L60 74 Z" fill="url(#ribbonOrangeL)"/>
  <path d="M76 62 L84 108 L66 98 L60 106 L60 74 Z" fill="url(#ribbonOrangeR)"/>

  <!-- medal body -->
  <circle cx="60" cy="48" r="34" fill="url(#medalOrange)"/>
  <circle cx="60" cy="48" r="27" fill="none" stroke="#fff7ed" stroke-width="2.5" opacity="0.8"/>

  <!-- lightbulb emblem -->
  <circle cx="60" cy="45" r="14" fill="#fff7ed" opacity="0.95"/>
  <path d="M54.5 47 a5.5 5.5 0 1 1 11 0 q0 3.4 -2.4 5 l-0.6 2 h-5 l-0.6 -2 q-2.4 -1.6 -2.4 -5 Z"
        fill="#f59e0b" stroke="#c2410c" stroke-width="1.2"/>
  <path d="M56.8 57.5 h6.4 M58 60 h4" stroke="#c2410c" stroke-width="2" stroke-linecap="round"/>

  <!-- gloss -->
  <circle cx="60" cy="48" r="34" fill="url(#shineOrange)"/>

  <!-- sparkles -->
  <path d="M92 22 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8 Z" fill="#fed7aa" opacity="0.95"/>
  <path d="M26 78 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z" fill="#ffedd5" opacity="0.9"/>
</svg>
