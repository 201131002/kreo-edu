  </defs>
  <circle cx="100" cy="100" r="94" stroke="url(#flG)" stroke-width="9"/>
  <circle cx="100" cy="100" r="81" stroke="#dcfce7" stroke-width="2.5" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- four flowers at cardinal points -->
  <g fill="#f472b6" stroke="#db2777" stroke-width="1.4">
