  </g>
  <g fill="#f472b6" stroke="#db2777" stroke-width="1.4">
    <circle cx="190" cy="100" r="5"/><circle cx="184" cy="92.5" r="5"/><circle cx="184" cy="107.5" r="5"/>
    <circle cx="176" cy="95" r="5"/><circle cx="176" cy="105" r="5"/>
