    <circle cx="95" cy="24" r="5"/><circle cx="105" cy="24" r="5"/>
    <circle cx="100" cy="17" r="3.6" fill="#fde047" stroke="#ca8a04"/>
  </g>
  <g fill="#f472b6" stroke="#db2777" stroke-width="1.4">
    <circle cx="100" cy="190" r="5"/><circle cx="92.5" cy="184" r="5"/><circle cx="107.5" cy="184" r="5"/>
    <circle cx="95" cy="176" r="5"/><circle cx="105" cy="176" r="5"/>
    <circle cx="100" cy="183" r="3.6" fill="#fde047" stroke="#ca8a04"/>
  </g>
  <g fill="#f472b6" stroke="#db2777" stroke-width="1.4">
    <circle cx="10" cy="100" r="5"/><circle cx="16" cy="92.5" r="5"/><circle cx="16" cy="107.5" r="5"/>
    <circle cx="24" cy="95" r="5"/><circle cx="24" cy="105" r="5"/>
