<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="medalPurple" x1="30" y1="24" x2="90" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#c4b5fd"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="ribbonPurpleL" x1="38" y1="66" x2="52" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="ribbonPurpleR" x1="68" y1="112" x2="82" y2="66" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <radialGradient id="shinePurple" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ribbons -->
  <path d="M44 62 L36 108 L54 98 L60 106 L60 74 Z" fill="url(#ribbonPurpleL)"/>
  <path d="M76 62 L84 108 L66 98 L60 106 L60 74 Z" fill="url(#ribbonPurpleR)"/>

  <!-- medal body -->
  <circle cx="60" cy="48" r="34" fill="url(#medalPurple)"/>
  <circle cx="60" cy="48" r="27" fill="none" stroke="#ede9fe" stroke-width="2.5" opacity="0.8"/>

  <!-- compass emblem -->
  <circle cx="60" cy="48" r="16" fill="#f5f3ff" opacity="0.95"/>
  <path d="M60 36 L64 46 L60 44 L56 46 Z" fill="#dc2626"/>
  <path d="M60 60 L56 50 L60 52 L64 50 Z" fill="#7c3aed"/>
  <path d="M48 48 L58 44 L56 48 L58 52 Z" fill="#a78bfa"/>
  <path d="M72 48 L62 52 L64 48 L62 44 Z" fill="#a78bfa"/>
  <circle cx="60" cy="48" r="2.4" fill="#5b21b6"/>

  <!-- gloss -->
  <circle cx="60" cy="48" r="34" fill="url(#shinePurple)"/>

  <!-- sparkles -->
  <path d="M92 22 l1.8 4.6 4.6 1.8 -4.6 1.8 -1.8 4.6 -1.8 -4.6 -4.6 -1.8 4.6 -1.8 Z" fill="#ddd6fe" opacity="0.95"/>
  <path d="M26 78 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z" fill="#e9d5ff" opacity="0.9"/>
